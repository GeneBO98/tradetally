name: Build Docker Images

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - fix/pnl-canonical-engine
    tags:
      - 'v*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish, for example v2.5.0
        required: true
        type: string
      prerelease:
        description: Publish this manual build as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradetally
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: tradetally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out manually selected release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.release_tag }}

      - name: Check out release tag
        if: github.event_name == 'release'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check out branch
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20.19.5'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --dir backend test

      - name: Run backend integration tests (real Postgres)
        run: pnpm --dir backend test:integration
        env:
          TEST_DATABASE_URL: postgres://tradetally:testpass@localhost:5432/tradetally_test

      - name: Run frontend tests
        run: pnpm --dir frontend test:run

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out manually selected release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.release_tag }}

      - name: Check out release tag
        if: github.event_name == 'release'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check out branch
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          build_release_tags() {
            local release_tag="$1"
            local is_prerelease="$2"

            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must match vX.Y.Z, got: $release_tag"
              exit 1
            fi

            local version="${release_tag#v}"
            local major_minor="${version%.*}"
            local major="${version%%.*}"
            local tags="potentialmidas/tradetally:${version},potentialmidas/tradetally:${major_minor},potentialmidas/tradetally:${major}"

            if [[ "$is_prerelease" == "true" ]]; then
              tags="${tags},potentialmidas/tradetally:nightly"
            else
              tags="${tags},potentialmidas/tradetally:latest"
            fi

            echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "release" ]]; then
            build_release_tags "$RELEASE_TAG_NAME" "$RELEASE_PRERELEASE"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            build_release_tags "$INPUT_RELEASE_TAG" "$INPUT_PRERELEASE"
          elif [[ "$GIT_REF" == refs/tags/v* ]]; then
            build_release_tags "$GIT_REF_NAME" "false"
          elif [[ "$GIT_REF" == "refs/heads/main" ]]; then
            echo "tags=potentialmidas/tradetally:latest" >> "$GITHUB_OUTPUT"
          elif [[ "$GIT_REF" == "refs/heads/develop" ]]; then
            echo "tags=potentialmidas/tradetally:nightly" >> "$GITHUB_OUTPUT"
          elif [[ "$GIT_REF" == "refs/heads/fix/pnl-canonical-engine" ]]; then
            echo "tags=potentialmidas/tradetally:pnl-engine" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported ref: $GIT_REF"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  android-apk:
    # Attach the prebuilt Android APK to the release. Kept as its own job so a
    # Docker build/push failure can't block the asset upload, and so it can be
    # run manually (workflow_dispatch) to attach the APK when a release event
    # didn't fire or the asset is missing.
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out manually selected release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.release_tag }}

      - name: Check out release tag
        if: github.event_name == 'release'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release tag
        id: rel
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG_NAME"
          else
            tag="$INPUT_RELEASE_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z, got: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify APK is present
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          apk="release-assets/android/tradetally-android.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::Android APK not found at $apk for $RELEASE_TAG. Build and commit the APK before releasing."
            exit 1
          fi
          ls -lh "$apk"

      - name: Upload Android APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-assets/android/tradetally-android.apk#TradeTally-Android-${RELEASE_TAG}.apk" \
            --clobber
