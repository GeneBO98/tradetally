name: Update Star History

on:
  schedule:
    - cron: '17 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: true

jobs:
  update-chart:
    if: github.repository == 'GeneBO98/tradetally'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20.19.5'

      - name: Generate star history chart
        run: node .github/scripts/generate-star-history.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit updated chart
        run: |
          if git diff --quiet -- .github/assets/star-history.svg; then
            echo "[INFO] Star history is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/star-history.svg
          git commit -m "docs: update star history chart"
          git push
